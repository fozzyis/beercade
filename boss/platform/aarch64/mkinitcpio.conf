# Generic initramfs for the Raspberry Pi B.O.S.S. image (Pi 4 and Pi 5).
# No autodetect: the image is built in a container, not on the target.
# Same astro_overlay hook as x86: squashfs root + tmpfs upper.
# The SD/eMMC/USB/NVMe controllers are built into linux-rpi; the block hook
# pulls in whatever is modular.
MODULES=(squashfs overlay)
BINARIES=()
FILES=()
HOOKS=(base udev modconf block astro_overlay)
COMPRESSION="zstd"
