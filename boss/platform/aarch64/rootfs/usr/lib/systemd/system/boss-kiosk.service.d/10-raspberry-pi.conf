# Raspberry Pi: Chromium blocklists the VideoCore GPU by default, which drops
# it to slow software raster. The kiosk pages are themed with BOSS_UI_EFFECTS
# (lite by default on ARM), so GPU raster is the main remaining win.
[Service]
Environment="BOSS_KIOSK_FLAGS=--ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy --disable-smooth-scrolling"
