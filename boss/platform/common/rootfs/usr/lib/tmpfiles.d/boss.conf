# B.O.S.S. state on the DATA partition (/data). Owner fixed up every boot,
# so a uid change between images does not lock the server out.
d /data/beercade      0755 root root -
Z /data/beercade/sync 0750 boss boss -
# Small persistent server state (venue UI theme).
d /data/beercade/state 0750 boss boss -
Z /data/beercade/state 0750 boss boss -
# Persistent service logs
d /data/beercade/logs 0777 root root -
