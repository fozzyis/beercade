name: CI

# One branch, two architectures: every push builds and tests the Rust
# workspace natively on aarch64 (RK3588 runner) and x86_64 (laptop runner).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch }}
    container:
      image: rust:1-bookworm
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The checkout action is JavaScript; the rust image ships without node.
      - name: Install build & test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            nodejs libsdl2-dev libsdl2-ttf-dev cmake g++ ninja-build pkg-config >/dev/null
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: TypeScript wire proto drift check
        run: cargo run -p beercade-shared --locked --bin gen_ts_proto -- --check
      - name: astro_rt CMake build & test
        run: |
          cmake -S astro/rt -B /tmp/astro_rt_build -G Ninja
          cmake --build /tmp/astro_rt_build
          ctest --test-dir /tmp/astro_rt_build --output-on-failure
      - name: Release build
        run: cargo build --release --locked -p astro-daemon -p astro-shell -p astro-tune -p boss-server
      - name: Show binaries
        run: ls -l target/release/astro-daemon target/release/astro-shell target/release/astro-tune target/release/boss-server

  frontends:
    runs-on: x86_64
    container:
      image: node:22-bookworm  # wrangler deps need node >= 22
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Website
        run: npm --prefix website ci && npm --prefix website run check
      - name: Kiosk UI
        run: npm --prefix boss/kiosk_ui ci && npm --prefix boss/kiosk_ui run check
