name: CI

# One branch, two architectures: every push builds and tests the Rust
# workspace natively on aarch64 (RK3588 runner) and x86_64 (laptop runner).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch }}
    container:
      image: rust:1-bookworm
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The checkout action is JavaScript; the rust image ships without node.
      - name: Install node for actions
        run: apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p astro-daemon -p boss-server
      - name: Show binaries
        run: ls -l target/release/astro-daemon target/release/boss-server

  frontends:
    runs-on: x86_64
    container:
      image: node:22-bookworm  # wrangler deps need node >= 22
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Website
        run: npm --prefix website ci && npm --prefix website run check
      - name: Kiosk UI
        run: npm --prefix boss/kiosk_ui ci && npm --prefix boss/kiosk_ui run check
