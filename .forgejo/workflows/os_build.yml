name: ASTRO OS Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-astro-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install SquashFS Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Execute Makefile Build
        run: make all
        
      - name: Upload OTA Image Artifact
        uses: actions/upload-artifact@v3
        with:
          name: astro_ota_update.squashfs
          path: /tmp/astro_build/astro_ota_update.squashfs
