default beercade
timeout 10
prompt 0

label beercade
    menu label B.E.E.R.C.A.D.E. Universal AArch64 (Radxa Rock 5C)
    kernel /Image
    fdt /rk3588s-rock-5c.dtb
    fdtoverlays /overlays/rock5c-hdmi-audio.dtbo
    initrd /initramfs.img
    append earlycon=uart8250,mmio32,0xfeb50000 console=tty1 console=ttyFIQ0,1500000 root=PARTLABEL=ROOT_A rootfstype=squashfs ro rootwait quiet splash
