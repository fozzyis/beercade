# A.S.T.R.O. Universal AArch64 image payload (RPi 4, RPi 5, Radxa Rock 5C)
PAYLOAD_NAME=astro
IMAGE_NAME=beercade-astro-universal-aarch64.raw
HOSTNAME=astro

CARGO_PACKAGES=(astro-daemon astro-tune)

PACMAN_PACKAGES=(mkinitcpio openssh avahi nss-mdns iproute2 less curl uboot-tools
  mesa ttf-dejavu libdrm libglvnd alsa-lib systemd-libs sdl2-compat zlib freetype2 libxkbcommon)

OVERLAYS=(
  shared/platform/common/rootfs:/
  shared/platform/x86_64/rootfs:/
  astro/rootfs/etc:/etc
  astro/rootfs/root:/root
  astro/platform/aarch64/rootfs:/
  astro/launcher:/usr/lib/beercade
)

ENABLE_UNITS=(beercade-grow-data beercade-provision-secrets systemd-networkd systemd-resolved sshd avahi-daemon astro-tune astro-daemon beercade-boot-check)

INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=astro/platform/aarch64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-astro.img
BOOT_DIR=shared/platform/universal-aarch64/boot
DATA_DIR=astro/platform/x86_64/data
