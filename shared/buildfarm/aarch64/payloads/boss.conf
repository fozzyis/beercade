# B.O.S.S. Raspberry Pi 4/5 image payload (bash-sourced by build_image.sh and
# container_build.sh). All paths are relative to the repo root.
PAYLOAD_NAME=boss
IMAGE_NAME=beercade-boss-universal-aarch64.raw
HOSTNAME=boss

CARGO_PACKAGES=(boss-server)

# Same frontend build as x86 (architecture-independent).
FRONTEND_BUILDS=(
  boss/kiosk_ui:build:/usr/share/boss/kiosk_ui
)

# Installed on top of the Arch Linux ARM "rpi-aarch64" rootfs, which already
# carries linux-rpi, raspberrypi-bootloader and firmware.
PACMAN_PACKAGES=(mkinitcpio openssh avahi nss-mdns iproute2 less curl uboot-tools
  seatd cage chromium mesa ttf-dejavu)

# shared/platform/x86_64 holds the first-boot DATA growth unit; despite the
# directory name it is architecture-independent.
OVERLAYS=(
  shared/platform/common/rootfs:/
  shared/platform/x86_64/rootfs:/
  boss/platform/common/rootfs:/
  boss/platform/aarch64/rootfs:/
)

ENABLE_UNITS=(beercade-grow-data beercade-provision-secrets systemd-networkd systemd-resolved sshd avahi-daemon seatd
  boss-server boss-kiosk beercade-boot-check)

INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=boss/platform/aarch64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-boss.img
BOOT_DIR=shared/platform/universal-aarch64/boot
DATA_DIR=boss/platform/common/data
