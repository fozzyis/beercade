# A.S.T.R.O. x86_64 image payload (bash-sourced by build_image.sh and container_build.sh).
# All paths are relative to the repo root.
PAYLOAD_NAME=astro
IMAGE_NAME=beercade-astro-x86_64.raw
HOSTNAME=astro

# Workspace packages built with `cargo build --release --locked -p <pkg>`; the
# binary of the same name is installed to /usr/bin.
CARGO_PACKAGES=(astro-daemon)

# Packages pacstrapped into the root filesystem.
PACMAN_PACKAGES=(base linux mkinitcpio openssh avahi nss-mdns iproute2 less)

# src:dest pairs, copied in order (later wins). *.local files and *.wants/
# directories are skipped; units are enabled from ENABLE_UNITS instead.
OVERLAYS=(
  astro/rootfs/etc:/etc
  astro/rootfs/root:/root
  astro/platform/x86_64/rootfs:/
)

ENABLE_UNITS=(systemd-networkd systemd-resolved sshd avahi-daemon astro-daemon)

INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=astro/platform/x86_64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-astro.img
ESP_DIR=astro/platform/x86_64/esp
DATA_DIR=astro/platform/x86_64/data
