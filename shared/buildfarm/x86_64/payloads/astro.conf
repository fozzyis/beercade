# A.S.T.R.O. x86_64 image payload (bash-sourced by build_image.sh and container_build.sh).
# All paths are relative to the repo root.
PAYLOAD_NAME=astro
IMAGE_NAME=beercade-astro-x86_64.raw
HOSTNAME=astro

# Workspace packages built with `cargo build --release --locked -p <pkg>`; the
# binary of the same name is installed to /usr/bin.
CARGO_PACKAGES=(astro-daemon astro-tune)

# Scripts run in archlinux:latest as `<script> <destdir>`; destdir is overlaid
# onto the rootfs. RetroArch is upstream + the project's patches + astro/rt.
NATIVE_BUILDS=(astro/emulators/retroarch/build_x86_64.sh)

# GPU drivers and firmware need more than the default 2 GiB root slot.
ROOT_MIB=4096

# Packages pacstrapped into the root filesystem.
PACMAN_PACKAGES=(base linux linux-firmware mkinitcpio openssh avahi nss-mdns iproute2 less
  # GPUs: Mesa for AMD (RADV) and Intel (ANV); nvidia-open for GTX 16xx / RTX+.
  mesa vulkan-radeon vulkan-intel vulkan-icd-loader nvidia-open nvidia-utils
  # RetroArch runtime libraries (binary comes from NATIVE_BUILDS).
  libdrm libglvnd alsa-lib systemd-libs sdl2-compat zlib freetype2 libxkbcommon
  # libretro cores (x86_64 set, see astro/emulators/cores/cores_x86_64.md).
  libretro-core-info libretro-mame libretro-snes9x libretro-genesis-plus-gx
  libretro-picodrive libretro-nestopia libretro-mgba libretro-mupen64plus-next
  libretro-beetle-psx-hw libretro-flycast libretro-ppsspp libretro-dolphin libretro-play)

# src:dest pairs, copied in order (later wins). *.local files and *.wants/
# directories are skipped; units are enabled from ENABLE_UNITS instead.
OVERLAYS=(
  astro/rootfs/etc:/etc
  astro/rootfs/root:/root
  astro/platform/x86_64/rootfs:/
)

ENABLE_UNITS=(systemd-networkd systemd-resolved sshd avahi-daemon astro-tune astro-daemon)

INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=astro/platform/x86_64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-astro.img
ESP_DIR=astro/platform/x86_64/esp
DATA_DIR=astro/platform/x86_64/data
