# B.O.S.S. x86_64 image payload (bash-sourced by build_image.sh and container_build.sh).
# All paths are relative to the repo root.
PAYLOAD_NAME=boss
IMAGE_NAME=beercade-boss-x86_64.raw
HOSTNAME=boss

CARGO_PACKAGES=(boss-server)

# Frontends built with `npm ci && npm run build` in node:22.
# Entries are src:build_subdir:dest (dest is a path in the root filesystem).
FRONTEND_BUILDS=(
  boss/kiosk_ui:build:/usr/share/boss/kiosk_ui
)

# Chromium + Mesa + Vulkan + split NIC/GPU firmware exceed the default 2 GiB slot.
ROOT_MIB=3072

PACMAN_PACKAGES=(base linux mkinitcpio openssh avahi nss-mdns iproute2 less curl
  # Hyper-V guest integration daemons (hv_kvp_daemon skips unless ConditionVirtualization=microsoft).
  hyperv
  # Firmware: PC NIC/Wi-Fi and AMD/ATI/Intel GPU blobs for bare-metal boards.
  linux-firmware-amdgpu linux-firmware-intel linux-firmware-radeon
  linux-firmware-realtek linux-firmware-mediatek linux-firmware-atheros
  linux-firmware-broadcom linux-firmware-marvell linux-firmware-other
  # Kiosk GPU acceleration (Wayland/Cage/Chromium on AMD/Intel) + software fallback.
  seatd cage chromium mesa vulkan-radeon vulkan-intel vulkan-icd-loader ttf-dejavu)

OVERLAYS=(
  shared/platform/common/rootfs:/
  shared/platform/x86_64/rootfs:/
  boss/platform/common/rootfs:/
)

# Optional x86_64 platform overlay (applied if present, matching aarch64 boss target)
for _d in "${SRC:-}" "${REPO:-}" .; do
  if [[ -n "$_d" && -d "$_d/boss/platform/x86_64/rootfs" ]]; then
    OVERLAYS+=(boss/platform/x86_64/rootfs:/)
    break
  fi
done

ENABLE_UNITS=(beercade-grow-data beercade-provision-secrets systemd-networkd systemd-resolved sshd avahi-daemon hv_kvp_daemon seatd
  boss-server boss-kiosk getty@tty2 beercade-boot-check)

# The astro_overlay hook and mkinitcpio config are image-agnostic (squashfs
# lower + tmpfs upper); boss reuses them rather than carrying copies.
INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=astro/platform/x86_64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-boss.img
ESP_DIR=boss/platform/x86_64/esp
DATA_DIR=boss/platform/common/data
