# B.O.S.S. x86_64 image payload (bash-sourced by build_image.sh and container_build.sh).
# All paths are relative to the repo root.
PAYLOAD_NAME=boss
IMAGE_NAME=beercade-boss-x86_64.raw
HOSTNAME=boss

CARGO_PACKAGES=(boss-server)

# Frontends built with `npm ci && npm run build` in node:22.
# Entries are src:build_subdir:dest (dest is a path in the root filesystem).
FRONTEND_BUILDS=(
  boss/kiosk_ui:build:/usr/share/boss/kiosk_ui
)

PACMAN_PACKAGES=(base linux mkinitcpio openssh avahi nss-mdns iproute2 less
  seatd cage chromium mesa ttf-dejavu)

OVERLAYS=(
  shared/platform/x86_64/rootfs:/
  boss/platform/x86_64/rootfs:/
)

ENABLE_UNITS=(beercade-grow-data systemd-networkd systemd-resolved sshd avahi-daemon seatd
  boss-server boss-kiosk)

# The astro_overlay hook and mkinitcpio config are image-agnostic (squashfs
# lower + tmpfs upper); boss reuses them rather than carrying copies.
INITCPIO_DIR=astro/platform/x86_64/initcpio
MKINITCPIO_CONF=astro/platform/x86_64/mkinitcpio.conf
INITRAMFS_NAME=initramfs-boss.img
ESP_DIR=boss/platform/x86_64/esp
DATA_DIR=boss/platform/x86_64/data
