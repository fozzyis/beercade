[package]
name = "beercade-shared"
version = "0.1.0"
edition = "2021"
authors = ["B.E.E.R.C.A.D.E. Team"]
description = "Shared IPC contracts, data models, authentication protocols & utilities for B.E.E.R.C.A.D.E."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
typeshare = { version = "1.0", optional = true }

[features]
default = ["typeshare"]
typeshare = ["dep:typeshare"]
