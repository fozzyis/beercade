<!-- EmulationStation-DE Systems Configuration for B.E.E.R.C.A.D.E. A.S.T.R.O. (RK3588S) -->
<systemList>
  <!-- 1. Arcade FBNeo -->
  <system>
    <name>arcade</name>
    <fullname>Arcade Classics & NeoGeo</fullname>
    <path>/beercade/roms/arcade</path>
    <extension>.zip .7z</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/fbneo_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>arcade</platform>
    <theme>arcade</theme>
  </system>

  <!-- 2. MAME Midway / Capcom -->
  <system>
    <name>mame</name>
    <fullname>MAME Arcade (Midway MK / NBA Jam)</fullname>
    <path>/beercade/roms/mame</path>
    <extension>.zip .7z</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/mame2003_plus_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>arcade</platform>
    <theme>mame</theme>
  </system>

  <!-- 3. Sony PlayStation 1 -->
  <system>
    <name>psx</name>
    <fullname>Sony PlayStation</fullname>
    <path>/beercade/roms/psx</path>
    <extension>.chd .cue .iso .pbp</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/duckstation_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
  </system>

  <!-- 4. Sony PlayStation 2 -->
  <system>
    <name>ps2</name>
    <fullname>Sony PlayStation 2</fullname>
    <path>/beercade/roms/ps2</path>
    <extension>.chd .iso .cso .bin .gz</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh pcsx2 --fullscreen --batch %ROM%</command>
    <platform>ps2</platform>
    <theme>ps2</theme>
  </system>

  <!-- 5. Nintendo GameCube -->
  <system>
    <name>gc</name>
    <fullname>Nintendo GameCube</fullname>
    <path>/beercade/roms/gc</path>
    <extension>.iso .ciso .gcm .gcz .rvz .wad .wia</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh dolphin-emu-nogui -b -e %ROM%</command>
    <platform>gc</platform>
    <theme>gc</theme>
  </system>

  <!-- 6. Nintendo Wii -->
  <system>
    <name>wii</name>
    <fullname>Nintendo Wii</fullname>
    <path>/beercade/roms/wii</path>
    <extension>.iso .ciso .gcz .rvz .wad .wia .wbfs</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh dolphin-emu-nogui -b -e %ROM%</command>
    <platform>wii</platform>
    <theme>wii</theme>
  </system>

  <!-- 7. Sega Dreamcast & NAOMI -->
  <system>
    <name>dreamcast</name>
    <fullname>Sega Dreamcast & NAOMI</fullname>
    <path>/beercade/roms/dreamcast</path>
    <extension>.chd .cdi .gdi .zip .7z</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/flycast_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>dreamcast</platform>
    <theme>dreamcast</theme>
  </system>

  <!-- 8. Sega Model 3 (Daytona 2 / Scud Race) -->
  <system>
    <name>model3</name>
    <fullname>Sega Model 3 Arcade</fullname>
    <path>/beercade/roms/model3</path>
    <extension>.zip .7z</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh supermodel -fullscreen -res=1920,1080 %ROM%</command>
    <platform>arcade</platform>
    <theme>model3</theme>
  </system>

  <!-- 9. Laserdisc Arcade (Dragon's Lair) -->
  <system>
    <name>daphne</name>
    <fullname>Laserdisc Arcade (Dragon's Lair)</fullname>
    <path>/beercade/roms/daphne</path>
    <extension>.daphne</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh hypseus singe vldp -fullscreen %ROM%</command>
    <platform>daphne</platform>
    <theme>daphne</theme>
  </system>

  <!-- 10. Nintendo 64 -->
  <system>
    <name>n64</name>
    <fullname>Nintendo 64</fullname>
    <path>/beercade/roms/n64</path>
    <extension>.z64 .n64 .v64</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/mupen64plus_next_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>n64</platform>
    <theme>n64</theme>
  </system>

  <!-- 11. Sony PSP -->
  <system>
    <name>psp</name>
    <fullname>Sony PlayStation Portable</fullname>
    <path>/beercade/roms/psp</path>
    <extension>.iso .cso .pbp .chd</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/ppsspp_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>psp</platform>
    <theme>psp</theme>
  </system>

  <!-- 12. Sony PS Vita -->
  <system>
    <name>psvita</name>
    <fullname>Sony PlayStation Vita</fullname>
    <path>/beercade/roms/psvita</path>
    <extension>.vpk .zip</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh vita3k -F -r %ROM%</command>
    <platform>psvita</platform>
    <theme>psvita</theme>
  </system>

  <!-- 13. Nintendo 3DS -->
  <system>
    <name>n3ds</name>
    <fullname>Nintendo 3DS</fullname>
    <path>/beercade/roms/n3ds</path>
    <extension>.3ds .cci .cxi .app</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh lime3ds-cli -f %ROM%</command>
    <platform>n3ds</platform>
    <theme>n3ds</theme>
  </system>

  <!-- 14. Super Nintendo (SNES) -->
  <system>
    <name>snes</name>
    <fullname>Super Nintendo</fullname>
    <path>/root/ROMs/snes</path>
    <extension>.zip .ZIP .sfc .SFC .smc .SMC .fig .FIG</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/snes9x_libretro.so %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
  </system>

  <!-- 15. Sega Mega Drive / Genesis -->
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive / Genesis</fullname>
    <path>/beercade/roms/megadrive</path>
    <extension>.md .bin .smd .gen .iso .chd</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/genesis_plus_gx_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
  </system>

  <!-- 16. Game Boy Advance / GBC -->
  <system>
    <name>gba</name>
    <fullname>Nintendo Game Boy Advance</fullname>
    <path>/beercade/roms/gba</path>
    <extension>.gba .gbc .gb .zip .7z</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/mgba_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>

  <!-- 17. DOS 90s PC Arcade (DOOM, Duke3D, Quake) -->
  <system>
    <name>pc</name>
    <fullname>DOS 90s PC Arcade</fullname>
    <path>/beercade/roms/pc</path>
    <extension>.zip .7z .dosz</extension>
    <command>/data/dev/beercade/emu_opti/rk3588_optimizer.sh retroarch -L /usr/lib/libretro/dosbox_pure_libretro.so --config /data/dev/beercade/emu_opti/retroarch_rk3588.cfg %ROM%</command>
    <platform>pc</platform>
    <theme>pc</theme>
  </system>
</systemList>
