# ==============================================================================
# B.E.E.R.C.A.D.E. A.S.T.R.O. - RK3588S RetroArch Ultra-Low Latency Configuration
# ==============================================================================

# Video Driver (Direct KMSDRM / Vulkan PanVK)
video_driver = "vulkan"
video_context_driver = "khr_display"
video_vsync = "true"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_frame_delay = "4"
video_max_swapchain_images = "2"
video_smooth = "false"
video_threaded = "false"

# Audio Driver (Direct ALSA MMAP, sub-5ms latency)
audio_driver = "alsa"
audio_device = "hw:0,0"
audio_latency = "16"
audio_sync = "true"
audio_mmap = "true"

# Controller & Input (evdev sub-millisecond polling)
input_driver = "udev"
input_poll_type_behavior = "0"
input_autodetect_enable = "true"

# Directories & Libretro Paths
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "/beercade/bios"
savefile_directory = "/beercade/saves"
savestate_directory = "/beercade/states"
screenshot_directory = "/beercade/screenshots"

# Performance Overlays & Fast-Forward
fps_show = "false"
video_font_enable = "true"
notification_show_fast_forward = "false"
