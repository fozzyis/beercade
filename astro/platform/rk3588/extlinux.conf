default console
timeout 30

label console
    menu label Beercade-ASTRO-Console (Debug / TTY Login)
    kernel /Image
    fdt /rk3588s-rock-5c.dtb
    append earlycon=uart8250,mmio32,0xfeb50000 console=tty1 console=ttyFIQ0,1500000 root=/dev/nvme0n1p2 rootfstype=ext4 rw rootwait pcie_aspm=off pcie_aspm.policy=performance nvme_core.max_host_mem_size_mb=0 nvme_core.default_ps_max_latency_us=0 nvme_core.multipath=N rootdelay=2 systemd.mask=boss-kiosk.service systemd.mask=boss-kiosk-FIX.service systemd.mask=beercade-frontend.service systemd.mask=beercade-autotriage.service

label raw-shell
    menu label Beercade-ASTRO-Raw-Shell (init=/bin/bash)
    kernel /Image
    fdt /rk3588s-rock-5c.dtb
    append earlycon=uart8250,mmio32,0xfeb50000 console=tty1 console=ttyFIQ0,1500000 root=/dev/nvme0n1p2 rootfstype=ext4 rw rootwait pcie_aspm=off pcie_aspm.policy=performance nvme_core.max_host_mem_size_mb=0 nvme_core.default_ps_max_latency_us=0 nvme_core.multipath=N rootdelay=2 init=/bin/bash

label kiosk
    menu label Beercade-ASTRO-Kiosk (Full UI)
    kernel /Image
    fdt /rk3588s-rock-5c.dtb
    append earlycon=uart8250,mmio32,0xfeb50000 console=tty1 console=ttyFIQ0,1500000 root=/dev/nvme0n1p2 rootfstype=ext4 rw rootwait pcie_aspm=off pcie_aspm.policy=performance nvme_core.max_host_mem_size_mb=0 nvme_core.default_ps_max_latency_us=0 nvme_core.multipath=N rootdelay=2
