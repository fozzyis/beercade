# A.S.T.R.O. x86_64 RetroArch configuration. Replaces the RK3588 config from
# astro/rootfs/root; unset keys take RetroArch defaults.

# Video: Vulkan straight to the display (VK_KHR_display), no compositor.
# Works on RADV (AMD), ANV (Intel) and the NVIDIA driver.
video_driver = "vulkan"
video_context_driver = "khr_display"
video_vsync = "true"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_frame_delay_auto = "true"
video_max_swapchain_images = "2"
video_smooth = "false"
video_threaded = "false"

# Audio: ALSA default device (HDMI/DP or onboard; pick per cabinet in /data).
audio_driver = "alsa"
audio_device = ""
audio_latency = "32"
audio_sync = "true"

input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_poll_type_behavior = "0"

libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
# Persistent state lives on the DATA partition.
system_directory = "/data/beercade/bios"
savefile_directory = "/data/beercade/saves"
savestate_directory = "/data/beercade/states"
screenshot_directory = "/data/beercade/screenshots"
rgui_browser_directory = "/data/beercade/roms"

menu_driver = "rgui"
fps_show = "false"
notification_show_fast_forward = "false"
