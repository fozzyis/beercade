# A.S.T.R.O. x86_64 RetroArch configuration. Replaces the RK3588 config from
# astro/rootfs/root; unset keys take RetroArch defaults.

# Video: Vulkan straight to the display (VK_KHR_display), no compositor.
# Works on RADV (AMD), ANV (Intel) and the NVIDIA driver.
video_driver = "vulkan"
video_context_driver = "khr_display"
video_vsync = "true"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_frame_delay_auto = "true"
video_max_swapchain_images = "2"
video_smooth = "false"
video_threaded = "false"

# Audio: ALSA default device (HDMI/DP or onboard; pick per cabinet in /data).
audio_driver = "alsa"
audio_device = ""
audio_latency = "32"
audio_sync = "true"

input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_poll_type_behavior = "0"

libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
# Persistent state lives on the DATA partition.
system_directory = "/data/beercade/bios"
savefile_directory = "/data/beercade/saves"
savestate_directory = "/data/beercade/states"
screenshot_directory = "/data/beercade/screenshots"
rgui_browser_directory = "/data/beercade/roms"

# One log per launch (overwritten) on DATA, readable without a console.
log_verbosity = "true"
log_to_file = "true"
log_to_file_timestamp = "false"
log_dir = "/data/beercade/logs"

menu_driver = "rgui"
fps_show = "false"
notification_show_fast_forward = "false"

# Customers get no RetroArch controls: no menu, no quit, no save states, no
# fast-forward. Leaving a game goes through the A.S.T.R.O. pause menu
# (astro-daemon), which talks to RetroArch over the command port.
config_save_on_exit = "false"
pause_nonactive = "false"
quit_press_twice = "false"
input_menu_toggle = "nul"
input_menu_toggle_btn = "nul"
input_menu_toggle_gamepad_combo = "0"
input_exit_emulator = "nul"
input_exit_emulator_btn = "nul"
input_quit_gamepad_combo = "0"
input_enable_hotkey = "nul"
input_pause_toggle = "nul"
input_reset = "nul"
input_save_state = "nul"
input_load_state = "nul"
input_state_slot_increase = "nul"
input_state_slot_decrease = "nul"
input_toggle_fast_forward = "nul"
input_hold_fast_forward = "nul"
input_toggle_slowmotion = "nul"
input_hold_slowmotion = "nul"
input_rewind = "nul"
input_screenshot = "nul"
input_toggle_fullscreen = "nul"
input_frame_advance = "nul"
input_movie_record_toggle = "nul"
input_shader_next = "nul"
input_shader_prev = "nul"
input_cheat_toggle = "nul"
input_audio_mute = "nul"
input_volume_up = "nul"
input_volume_down = "nul"
input_netplay_game_watch = "nul"
input_game_focus_toggle = "nul"
input_desktop_menu_toggle = "nul"
