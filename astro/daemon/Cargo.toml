[package]
name = "astro-daemon"
version = "0.1.0"
edition = "2021"
authors = ["B.E.E.R.C.A.D.E. Team"]
description = "O.R.I.O.N. Node Daemon for RK3588S Arcade Stations running A.S.T.R.O."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
sha2 = "0.10"
beercade-shared = { path = "../../shared/crates/beercade-shared" }
beercade-hal = { path = "../../shared/crates/beercade-hal" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
