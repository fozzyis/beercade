# =============================================================================
# B.E.E.R.C.A.D.E. A.S.T.R.O. - Real-time scheduling limits (1000 Hz input RT)
# -----------------------------------------------------------------------------
# Grants the beercade runtime user the right to raise threads to SCHED_FIFO
# priority 90 (the 1000 Hz astro_rt evdev producer) and to lock every page it
# will ever fault in, so neither the input thread nor the KMSDRM frame loop
# ever takes a scheduler or page-fault hit mid-frame.
# Install to: /etc/security/limits.d/50-beercade-rt.conf
# =============================================================================

# domain        type  item    value
beercade        -     rtprio  90
beercade        -     memlock unlimited
beercade        -     nice    -20

@beercade       -     rtprio  90
@beercade       -     memlock unlimited
@beercade       -     nice    -20